services:
  catpaw2api:
    build: .
    container_name: catpaw2api
    restart: unless-stopped
    ports:
      - "7867:7867"
    environment:
      CP2A_API_KEY: ${CP2A_API_KEY:-change-me}
      TZ: Asia/Shanghai
    volumes:
      - ./auths:/app/auths
      - ./data:/app/data
      - ./config.json:/app/config.json:ro
